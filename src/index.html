<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>REZ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="size-compact">
<div id="island" class="island">
  <div class="glow"></div>

  <!-- ÉTAT PILULE -->
  <button class="pill-face" id="pillFace" title="Ouvrir REZ">
    <span class="pf-left"><span class="dot" id="pillDot"></span><span id="pillTime">--:--</span></span>
    <span class="pf-right">
      <span class="bars hidden" id="pillBars"><i></i><i></i><i></i></span>
      <span id="pillInfo"></span>
    </span>
  </button>

  <!-- ÉTAT OUVERT -->
  <div class="open-face">
    <header class="top">
      <span class="brand"><img src="logo.png" alt="">REZ</span>
      <span class="top-time"><b id="time">00:00</b><span id="date"></span></span>
      <button class="icon-btn" id="btnCollapse" title="Réduire (Échap)">
        <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </button>
    </header>

    <main id="views">
      <!-- ACCUEIL -->
      <section class="view active" data-view="home">
        <div class="hero">
          <div class="clock"><span id="bigTime">00:00</span><span id="sec">00</span></div>
          <div class="weather" id="weather">
            <span class="w-ico" id="wIco">·</span>
            <span><b id="wTemp">--°</b><small id="wDesc">Météo REZ</small></span>
          </div>
        </div>
        <div class="w-side" id="wSide"></div>
        <div class="card update hidden" id="updCard">
          <span><b>MAJ <span id="updVer"></span></b><small id="updNotes"></small></span>
          <button class="btn primary sm" id="updBtn">Installer</button>
        </div>
        <div class="card np" id="npCard">
          <div class="art sm" id="npArt">♪</div>
          <div class="meta"><div class="t" id="npTitle">Aucune lecture</div><div class="s" id="npArtist">—</div></div>
          <button class="ctl sm" id="npPlay" title="Lecture/Pause"><svg viewBox="0 0 24 24" id="npPlayIco"><path d="M7 4l13 8-13 8z"/></svg></button>
        </div>
      </section>

      <!-- MULTIMÉDIA -->
      <section class="view" data-view="media">
        <div class="card now">
          <div class="art" id="mArt">♪</div>
          <div class="meta">
            <div class="t" id="mTitle">Aucune lecture</div>
            <div class="s" id="mArtist">—</div>
            <div class="chip" id="mApp"></div>
          </div>
        </div>
        <div class="controls">
          <button class="ctl" id="mPrev" title="Précédent"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5"/></svg></button>
          <button class="ctl big" id="mPlay" title="Lecture/Pause"><svg viewBox="0 0 24 24" id="mPlayIco"><path d="M7 4l13 8-13 8z"/></svg></button>
          <button class="ctl" id="mNext" title="Suivant"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg></button>
        </div>
        <div class="card vol">
          <button class="icon-btn" id="mMute" title="Muet"><svg viewBox="0 0 24 24" id="mMuteIco"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/></svg></button>
          <input type="range" id="mVol" min="0" max="100" value="50">
          <span id="mVolVal">50</span>
        </div>
      </section>

      <!-- DISCORD -->
      <section class="view" data-view="discord">
        <div class="card form">
          <div class="row between">
            <span class="status" id="dStatus">Déconnecté</span>
            <button class="btn sm" id="dOpen">Ouvrir Discord</button>
          </div>
          <input id="dDetails" maxlength="128" placeholder="Ligne 1">
          <input id="dState" maxlength="128" placeholder="Ligne 2">
          <div class="row">
            <button class="btn primary grow" id="dSet">Activer la présence</button>
            <button class="btn" id="dClear">Effacer</button>
          </div>
        </div>
        <p class="hint">Rich Presence via l'IPC officiel de Discord. Client ID dans Paramètres.</p>
      </section>

      <!-- STATS -->
      <section class="view" data-view="stats">
        <div class="card form">
          <div class="row">
            <select id="sGame" class="grow">
              <option value="fortnite">Fortnite</option>
              <option value="r6">Rainbow Six</option>
              <option value="valorant">Valorant</option>
              <option value="apex">Apex</option>
              <option value="rl">Rocket League</option>
            </select>
            <select id="sPlat"><option value="epic">Epic</option><option value="psn">PSN</option><option value="xbl">Xbox</option></select>
            <select id="sWin"><option value="lifetime">Total</option><option value="season">Saison</option></select>
          </div>
          <div class="row">
            <input id="sName" class="grow" placeholder="Pseudo (Valorant : Nom#TAG)">
            <button class="btn primary" id="sGo">OK</button>
          </div>
        </div>
        <div id="sOut"></div>
      </section>

      <!-- CHAT IA -->
      <section class="view chat-view" data-view="ai">
        <div class="chat" id="aLog"><div class="msg bot">Salut, je suis REZ. Pose ta question.</div></div>
        <form class="chat-in" id="aForm">
          <button type="button" class="icon-btn" id="aClear" title="Effacer"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
          <textarea id="aIn" rows="1" placeholder="Demande à REZ…"></textarea>
          <button class="btn primary sq" id="aSend" title="Envoyer"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </form>
      </section>

      <!-- FICHIERS -->
      <section class="view" data-view="files">
        <div class="fgrid" id="fGrid"></div>
        <form class="row" id="fForm">
          <input id="fPath" class="grow" placeholder="Coller un chemin ou glisser un dossier">
          <button class="btn primary sq" title="Épingler"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        </form>
      </section>

      <!-- PARAMÈTRES -->
      <section class="view" data-view="settings">
        <div class="seg" id="pSize">
          <button data-size="compact">Compact</button>
          <button data-size="large">Large</button>
          <i></i>
        </div>
        <div class="card form">
          <label>Raccourci<input id="pShortcut" readonly placeholder="Clique puis tape"></label>
          <label>Ville météo<input id="pCity"></label>
          <label>Discord Client ID<input id="pDiscord" inputmode="numeric"></label>
          <label>Clé fortnite-api.com<input id="pFn" type="password" autocomplete="off"></label>
          <label>Clé API Anthropic<input id="pAi" type="password" autocomplete="off"></label>
          <label>Modèle IA<input id="pModel" placeholder="claude-opus-5-5"></label>
          <label class="tog"><input type="checkbox" id="pPill"><span></span>Pilule toujours visible</label>
          <label class="tog"><input type="checkbox" id="pBlur"><span></span>Réduire quand REZ perd le focus</label>
          <label class="tog"><input type="checkbox" id="pAuto"><span></span>Lancer avec Windows</label>
          <button class="btn primary" id="pSave">Enregistrer</button>
        </div>
        <div class="row between foot">
          <span class="ver">REZ <b id="pVer">-</b></span>
          <span class="row">
            <button class="btn sm" id="pCheck">MAJ</button>
            <button class="btn sm danger" id="pQuit">Quitter</button>
          </span>
        </div>
      </section>
    </main>

    <nav class="dock" id="dock">
      <button data-go="home" class="active" title="Accueil"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg></button>
      <button data-go="media" title="Multimédia"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button data-go="discord" title="Discord"><svg viewBox="0 0 24 24"><path d="M8 7.5C9.3 7 10.6 6.8 12 6.8s2.7.2 4 .7M7.5 16.5c1.4.6 2.9.9 4.5.9s3.1-.3 4.5-.9"/><path d="M8.5 5.5L7 4C5 4.5 3.7 5.4 3 6.5 2 9 1.6 12.5 2 16c1.3 1.5 3 2.5 5 3l1.3-2M15.5 5.5L17 4c2 .5 3.3 1.4 4 2.5 1 2.5 1.4 6 1 9.5-1.3 1.5-3 2.5-5 3l-1.3-2"/><circle cx="9" cy="12.5" r="1.3"/><circle cx="15" cy="12.5" r="1.3"/></svg></button>
      <button data-go="stats" title="Stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button data-go="ai" title="Chat IA"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></button>
      <button data-go="files" title="Fichiers"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></button>
      <button data-go="settings" title="Paramètres"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><i class="badge hidden" id="setBadge"></i></button>
    </nav>
  </div>
  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
